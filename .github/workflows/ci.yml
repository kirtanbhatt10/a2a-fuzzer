name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit + end-to-end tests
        run: pytest -v

  self-test:
    # Runs the real CLI against the bundled demo agent in both modes.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Hardened agent must pass with --fail-on medium
        run: |
          python examples/demo_agent.py --secure --port 9999 &
          sleep 1
          a2afuzz run http://127.0.0.1:9999/ -p a2a --rate 0 --fail-on medium -o reports/secure
      - name: Buggy agent must be caught (expect exit 1)
        run: |
          python examples/demo_agent.py --port 9998 &
          sleep 1
          if a2afuzz run http://127.0.0.1:9998/ -p a2a --rate 0 --fail-on high -o reports/buggy; then
            echo "fuzzer missed the bugs" && exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: demo-reports
          path: reports/
