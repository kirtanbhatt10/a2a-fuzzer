name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  package:
    # Build the distribution, install the wheel into a clean environment and
    # run the real CLI against the bundled demo agent in both modes.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean virtual environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/a2afuzz --version
          /tmp/wheel-env/bin/python -m a2afuzz list -p a2a
      - name: Hardened demo agent must pass --fail-on low
        run: |
          python examples/demo_agent.py --secure --port 9998 &
          sleep 1
          /tmp/wheel-env/bin/a2afuzz run http://127.0.0.1:9998/ -p a2a --rate 0 \
            --fail-on low -o reports/secure
      - name: Vulnerable demo agent must be caught (exit 1)
        run: |
          python examples/demo_agent.py --port 9999 &
          sleep 1
          set +e
          /tmp/wheel-env/bin/a2afuzz run http://127.0.0.1:9999/ -p a2a --rate 0 \
            --fail-on high -o reports/vulnerable
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "expected exit code 1, got $status"
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: demo-reports
          path: reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
