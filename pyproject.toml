[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-fuzzer"
version = "0.1.0"
description = "Conformance and robustness fuzzing harness for Agent-to-Agent (A2A) and MCP JSON-RPC endpoints you own."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Kirtan Bhatt", email = "kirtan11bhatt@gmail.com" }]
keywords = ["a2a", "mcp", "json-rpc", "fuzzing", "agent-security", "conformance-testing", "llm-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/kirtanbhatt10/a2a-fuzzer"
Issues = "https://github.com/kirtanbhatt10/a2a-fuzzer/issues"

[project.scripts]
a2afuzz = "a2afuzz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["a2afuzz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"
