[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "a2a-fuzzer"
dynamic = ["version"]
description = "Bounded conformance and robustness fuzzing for A2A, MCP, and JSON-RPC endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kirtan Bhatt", email = "kirtan11bhatt@gmail.com" }]
keywords = ["a2a", "mcp", "json-rpc", "fuzzing", "security", "agents", "conformance-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/kirtanbhatt10/a2a-fuzzer"
Source = "https://github.com/kirtanbhatt10/a2a-fuzzer"
Issues = "https://github.com/kirtanbhatt10/a2a-fuzzer/issues"
Changelog = "https://github.com/kirtanbhatt10/a2a-fuzzer/blob/main/CHANGELOG.md"

[project.scripts]
a2afuzz = "a2afuzz.cli:app"

[tool.hatch.version]
path = "a2afuzz/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["a2afuzz"]

[tool.hatch.build.targets.sdist]
include = [
  "/a2afuzz",
  "/examples",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
